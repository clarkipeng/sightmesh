[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-deck"
version = "0.1.0"
description = "Local visible-agent orchestration for cdesktop and Repowire"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "agent-deck contributors" }]
dependencies = []

[project.scripts]
agent-deck = "agent_deck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_deck"]
