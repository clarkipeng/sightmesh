name: Feature request
description: Propose a bounded experimental improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator problem is not covered by current native owners?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest proposed change
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Ownership and security impact
      description: Explain effects on cdesktop, Git, .context, Repowire, credentials, and arbitrary-command risk.
    validations:
      required: true
  - type: checkboxes
    id: policy
    attributes:
      label: Policy
      options:
        - label: This does not require credential extraction, session sharing, or rate-limit evasion.
          required: true
